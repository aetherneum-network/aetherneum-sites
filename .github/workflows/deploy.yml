name: deploy-aether-sites

# Auto-deploy aether-sites to the production host on push to main.
#
# REQUIRED GitHub Secrets (set under Settings → Secrets → Actions):
#   - CRYPTOHOST_SSH_KEY     : the private deploy key (no passphrase)
#   - CRYPTOHOST_HOST        : the host address
#   - CRYPTOHOST_USER        : the deploy user
#   - CRYPTOHOST_KNOWN_HOSTS : output of `ssh-keyscan <host> | head -1`
#                              (one line, the ed25519 fingerprint)
# REQUIRED GitHub Variables (set under Settings → Variables → Actions):
#   - SITES_ROOT             : directory on the host that holds the two site folders
#   - SITES_CONTAINER        : name of the nginx container to reload
#
# Until those secrets exist, this workflow stays inert — the on/push trigger
# fires but the deploy step exits 0 with "secrets missing, skipping deploy".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gate — ensure secrets are configured
        id: gate
        env:
          KEY: ${{ secrets.CRYPTOHOST_SSH_KEY }}
          HOST: ${{ secrets.CRYPTOHOST_HOST }}
          USER: ${{ secrets.CRYPTOHOST_USER }}
          KNOWN: ${{ secrets.CRYPTOHOST_KNOWN_HOSTS }}
          ROOT: ${{ vars.SITES_ROOT }}
          CONT: ${{ vars.SITES_CONTAINER }}
        run: |
          if [ -z "$KEY" ] || [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$KNOWN" ] || [ -z "$ROOT" ] || [ -z "$CONT" ]; then
            echo "Required secrets/variables not set — workflow will skip deploy."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "All secrets present — will deploy."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup SSH
        if: steps.gate.outputs.skip == 'false'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CRYPTOHOST_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.CRYPTOHOST_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy via scp + nginx reload
        if: steps.gate.outputs.skip == 'false'
        env:
          HOST: ${{ secrets.CRYPTOHOST_HOST }}
          USER: ${{ secrets.CRYPTOHOST_USER }}
          ROOT: ${{ vars.SITES_ROOT }}
          CONT: ${{ vars.SITES_CONTAINER }}
        run: |
          STAGING="/tmp/aether-staging-gh-${GITHUB_RUN_ID}"
          ssh -i ~/.ssh/id_ed25519 "$USER@$HOST" "mkdir -p $STAGING"
          scp -i ~/.ssh/id_ed25519 -rq aetherneum-com university-aetherneum-com "$USER@$HOST:$STAGING/"
          ssh -i ~/.ssh/id_ed25519 "$USER@$HOST" "
            sudo cp -a $STAGING/aetherneum-com/.            $ROOT/aetherneum-com/ &&
            sudo cp -a $STAGING/university-aetherneum-com/. $ROOT/university-aetherneum-com/ &&
            sudo chown -R $USER:$USER $ROOT/ &&
            sudo docker exec $CONT nginx -s reload &&
            rm -rf $STAGING &&
            echo 'OK'
          "

      - name: Summary
        run: |
          echo "## Deploy summary" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.gate.outputs.skip }}" = "true" ]; then
            echo "⏭ Skipped — secrets not configured" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ Deployed · nginx reloaded" >> $GITHUB_STEP_SUMMARY
          fi
