# Aetherneum brand pillar — nginx config
# Two virtual hosts served from the static site directories.
# Authelia handles auth at the Traefik layer; nginx itself is open.

server {
    listen 80;
    server_name aetherneum.com www.aetherneum.com;
    root /usr/share/nginx/sites/aetherneum-com;
    index index.html;
    charset utf-8;

    # Health probe for the Traefik load balancer
    location = /_health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Static asset cache (long since content is hashed at deploy time)
    location ~* \.(svg|js|css|woff2?|ttf|eot|png|jpg|jpeg|webp|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Security headers (defensive defaults — site is private during phase 1)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
}

server {
    listen 80;
    server_name university.aetherneum.com;
    root /usr/share/nginx/sites/university-aetherneum-com;
    index index.html;
    charset utf-8;

    location = /_health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location ~* \.(svg|js|css|woff2?|ttf|eot|png|jpg|jpeg|webp|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
}

# Default server: returns 444 for unknown hosts, but answers the health probe
# (Traefik load-balancer health check sends without a matching Host header)
server {
    listen 80 default_server;
    server_name _;

    location = /_health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 444;
    }
}
