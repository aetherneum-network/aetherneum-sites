<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-label="Aetherneum seal">
  <title>Aetherneum seal — Per Æthera Ad Astra</title>
  <defs>
    <radialGradient id="seal-gold" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#c79348"/>
      <stop offset="65%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#6b2e08"/>
    </radialGradient>
    <radialGradient id="seal-paper" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#faf7ef"/>
      <stop offset="100%" stop-color="#f3eee2"/>
    </radialGradient>
  </defs>
  <circle cx="160" cy="160" r="156" fill="url(#seal-gold)"/>
  <circle cx="160" cy="160" r="132" fill="url(#seal-paper)"/>
  <circle cx="160" cy="160" r="138" fill="none" stroke="#92400e" stroke-width="0.7"/>
  <circle cx="160" cy="160" r="120" fill="none" stroke="#155e75" stroke-width="0.5" stroke-opacity="0.45"/>
  <text x="160" y="200" font-family="'EB Garamond', Garamond, Georgia, serif" font-size="150" font-weight="600" font-style="italic" fill="#155e75" text-anchor="middle" letter-spacing="-0.02em">Æ</text>
  <defs>
    <path id="seal-top" d="M 50,160 a 110,110 0 0 1 220,0" fill="none"/>
    <path id="seal-bot" d="M 50,160 a 110,110 0 0 0 220,0" fill="none"/>
  </defs>
  <text font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="13" font-weight="600" fill="#92400e" letter-spacing="0.36em" text-anchor="middle">
    <textPath href="#seal-top" startOffset="50%">AETHERNEUM</textPath>
  </text>
  <text font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="11" font-weight="500" fill="#92400e" letter-spacing="0.28em" text-anchor="middle">
    <textPath href="#seal-bot" startOffset="50%">PER &#xC6;THERA AD ASTRA</textPath>
  </text>
  <g fill="#faf7ef">
    <g transform="translate(160,160)">
      <g transform="rotate(0)"><path d="M 0 -148 L 2 -144 L 0 -140 L -2 -144 Z"/></g>
      <g transform="rotate(45)"><path d="M 0 -148 L 2 -144 L 0 -140 L -2 -144 Z"/></g>
      <g transform="rotate(90)"><path d="M 0 -148 L 2 -144 L 0 -140 L -2 -144 Z"/></g>
      <g transform="rotate(135)"><path d="M 0 -148 L 2 -144 L 0 -140 L -2 -144 Z"/></g>
      <g transform="rotate(180)"><path d="M 0 -148 L 2 -144 L 0 -140 L -2 -144 Z"/></g>
      <g transform="rotate(225)"><path d="M 0 -148 L 2 -144 L 0 -140 L -2 -144 Z"/></g>
      <g transform="rotate(270)"><path d="M 0 -148 L 2 -144 L 0 -140 L -2 -144 Z"/></g>
      <g transform="rotate(315)"><path d="M 0 -148 L 2 -144 L 0 -140 L -2 -144 Z"/></g>
    </g>
  </g>
  <text x="160" y="252" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="11" font-weight="500" fill="#92400e" text-anchor="middle" letter-spacing="0.3em">MMXXVI</text>
